# Builds the Windows installer on every push to main. Download it from the
# run's page in the Actions tab, under "Artifacts".
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Basalt-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
