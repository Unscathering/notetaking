# Builds Basalt for Windows on every push to main, as a check and for testing.
# Download it from the run's page in the Actions tab, under "Artifacts".
# Published versions (with direct download links) come from release.yml.
name: Windows build

on:
  push:
    branches: [main]
    # Changes to notes like the README don't need a new build.
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

# A newer push stops the older build, so the newest one finishes sooner.
concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - name: Gather the downloads
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/Basalt-Setup.exe
          cp src-tauri/target/release/basalt.exe out/Basalt-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Basalt-windows
          path: out/*.exe
          if-no-files-found: error
